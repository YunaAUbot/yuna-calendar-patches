name: Build and release Morphe patches
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish or verify (must match source version)
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: collective-android
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
      - name: Build without personal credentials
        run: python3 scripts/build_public.py
      - name: Verify Morphe discovery and bundle
        run: |
          python3 tests/verify_source.py
          python3 tests/verify_bundle.py
          $(python3 scripts/java.py) -jar .build-tools/morphe-desktop-1.18.0-all.jar list-patches --patches=patches/build/libs/patches-$(python3 scripts/version.py).mpp -pv
      - name: Publish tagged bundle
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        env:
          RELEASE_TOKEN: ${{ github.token }}
          # Job tokens access the API, not private web downloads. Owner must hash-check the download independently.
          RELEASE_ALLOW_METADATA_ONLY: '1'
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: python3 scripts/publish_forgejo.py
